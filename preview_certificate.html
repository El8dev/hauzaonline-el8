<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Preview Certificate</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap');
        
        body {
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            padding: 2rem;
            margin: 0;
            font-family: 'Amiri', 'Traditional Arabic', serif;
        }

        #cert-print-area {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 0.8; /* Portrait proportions */
            position: relative;
            border: 4px solid #b45309;
            border-radius: 12px;
            background-color: #fffdf5;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            margin: 0 auto;
            box-sizing: border-box;
        }

        #cert-custom-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        #cert-content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        /* Mock Data Overlay */
        #cert-stud-name {
            position: absolute;
            top: 37%;
            right: 38%;
            width: 50%;
            text-align: center;
            font-size: clamp(1.1rem, 4vw, 1.8rem);
            font-weight: 900;
            color: #000;
        }

        .cert-grade {
            position: absolute;
            right: 65%;
            width: 25%;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #000;
        }

    </style>
</head>
<body>

    <div id="cert-print-area">
        <img id="cert-custom-bg-img" src="5429417628490471165.jpg" alt="Certificate Background">

        <div id="cert-content-layer">
            <div id="cert-stud-name">طالبة تجريبية (زينب محمد)</div>
            
            <div class="cert-grade" style="top: 54.5%;">100</div>
            <div class="cert-grade" style="top: 58.5%;">95</div>
            <div class="cert-grade" style="top: 62.5%;">90</div>
            <div class="cert-grade" style="top: 66.5%;">88</div>
            <div class="cert-grade" style="top: 70.5%;">92</div>
            <div class="cert-grade" style="top: 74.5%;">99</div>
            <div class="cert-grade" style="top: 78.5%; font-size: 1.35rem; font-weight: 900; color: #991b1b;">امتياز (94%)</div>
        </div>
    </div>

</body>
</html>
